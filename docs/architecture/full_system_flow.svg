<text class="th" x="680" y="482" text-anchor="middle" dominant-baseline="central" fill="#085041">Qdrant</text>
<text class="ts" x="680" y="500" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">per-codebase collection [#14]</text>
<text class="ts" x="680" y="518" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">hybrid dense+BM25, RRF [#19,#20]</text>

<rect x="860" y="462" width="320" height="78" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="1020" y="482" text-anchor="middle" dominant-baseline="central" fill="#712B13">Postgres</text>
<text class="ts" x="1020" y="500" text-anchor="middle" dominant-baseline="central" fill="#993C1D">symbols/references index [#21,#22]</text>
<text class="ts" x="1020" y="518" text-anchor="middle" dominant-baseline="central" fill="#993C1D">inner functions excluded [#24]</text>

<text class="th" x="40" y="596" dominant-baseline="central">B — single-shot query (POST /codebases/{id}/query)</text>

<rect x="590" y="630" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="740" y="650" text-anchor="middle" dominant-baseline="central" fill="#0C447C">POST /codebases/{id}/query</text>
<text class="ts" x="740" y="668" text-anchor="middle" dominant-baseline="central" fill="#185FA5">codebase id + question [#8]</text>
<line x1="740" y1="686" x2="740" y2="746" class="arr" marker-end="url(#arrow)"/>

<rect x="590" y="746" width="300" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="740" y="766" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner — Claude Haiku</text>
<text class="ts" x="740" y="784" text-anchor="middle" dominant-baseline="central" fill="#534AB7">structured routing decision [#9,#33]</text>
<text class="ts" x="740" y="802" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Haiku here; critic uses Sonnet [#36]</text>

<path d="M740 824 L740 866 L490 866 L490 908" class="arr" marker-end="url(#arrow)"/>
<path d="M740 824 L740 866 L990 866 L990 908" class="arr" marker-end="url(#arrow)"/>

<rect x="320" y="908" width="340" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="490" y="928" text-anchor="middle" dominant-baseline="central" fill="#085041">Retriever agent — Haiku + Voyage</text>
<text class="ts" x="490" y="946" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">hybrid dense+BM25, RRF, rerank [#20]</text>
<text class="ts" x="490" y="964" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">score-gated reformulation, ≤1 retry [#32]</text>

<rect x="820" y="908" width="340" height="78" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="990" y="928" text-anchor="middle" dominant-baseline="central" fill="#712B13">Code-navigation</text>
<text class="ts" x="990" y="946" text-anchor="middle" dominant-baseline="central" fill="#993C1D">deterministic lookup, no Claude [#10,#34]</text>
<text class="ts" x="990" y="964" text-anchor="middle" dominant-baseline="central" fill="#993C1D">symbol from planner; ambiguity kept [#25]</text>

<path d="M490 986 L490 1028 L740 1028 L740 1070" class="arr" marker-end="url(#arrow)"/>
<path d="M990 986 L990 1028 L740 1028 L740 1070" class="arr" marker-end="url(#arrow)"/>

<rect x="570" y="1070" width="340" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="740" y="1090" text-anchor="middle" dominant-baseline="central" fill="#72243E">Unified evidence</text>
<text class="ts" x="740" y="1108" text-anchor="middle" dominant-baseline="central" fill="#993556">shared schema: retriever + code-nav [#35]</text>
<line x1="740" y1="1126" x2="740" y2="1186" class="arr" marker-end="url(#arrow)"/>

<rect x="590" y="1186" width="300" height="78" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="740" y="1206" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Critic-synthesizer — Sonnet</text>
<text class="ts" x="740" y="1224" text-anchor="middle" dominant-baseline="central" fill="#534AB7">checks evidence; answers or refuses</text>
<text class="ts" x="740" y="1242" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one call: judge + generate [#11,#36]</text>
<line x1="740" y1="1264" x2="740" y2="1324" class="arr" marker-end="url(#arrow)"/>

<rect x="570" y="1324" width="340" height="78" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="5 4"/>
