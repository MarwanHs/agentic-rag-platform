<text class="ts" x="740" y="1362" text-anchor="middle" dominant-baseline="central" fill="#185FA5">answer/refused/citations/sources [#26]</text>
<text class="ts amber" x="740" y="1380" text-anchor="middle" dominant-baseline="central">currently: 501 not implemented</text>

<text class="th" x="40" y="1458" dominant-baseline="central">C — conversation (multi-turn)</text>

<rect x="590" y="1488" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
