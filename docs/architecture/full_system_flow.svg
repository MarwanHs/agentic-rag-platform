<text class="ts" x="850" y="338" text-anchor="middle" dominant-baseline="central">per-step tracking, polled [#4,#5]</text>
<text class="ts" x="850" y="356" text-anchor="middle" dominant-baseline="central">ready only if all steps succeed [#6]</text>

<path d="M850 378 L850 420 L680 420 L680 462" class="arr" marker-end="url(#arrow)"/>
<path d="M850 378 L850 420 L1020 420 L1020 462" class="arr" marker-end="url(#arrow)"/>

