<text class="ts" x="740" y="1642" text-anchor="middle" dominant-baseline="central" fill="#185FA5">{message} → same response shape [#30]</text>
<text class="ts amber" x="740" y="1660" text-anchor="middle" dominant-baseline="central">currently: 501 not implemented</text>
<line x1="740" y1="1682" x2="740" y2="1742" class="arr" marker-end="url(#arrow)"/>

<rect x="560" y="1742" width="360" height="78" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="740" y="1762" text-anchor="middle" dominant-baseline="central" fill="#27500A">Planner — context check (LangGraph)</text>
<text class="ts" x="740" y="1780" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">sufficient → skip straight to critic [#29]</text>
<text class="ts" x="740" y="1798" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">insufficient → reuse retriever/code-nav [#12]</text>
<line x1="740" y1="1820" x2="740" y2="1880" class="arr" marker-end="url(#arrow)"/>

<rect x="570" y="1880" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="740" y="1900" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Critic-synthesizer (same as B)</text>
<text class="ts" x="740" y="1918" text-anchor="middle" dominant-baseline="central" fill="#534AB7">runs every turn regardless of context [#11]</text>
<line x1="740" y1="1936" x2="740" y2="1996" class="arr" marker-end="url(#arrow)"/>

<rect x="570" y="1996" width="340" height="78" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="5 4"/>
