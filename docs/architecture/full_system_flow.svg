<text class="ts" x="740" y="1526" text-anchor="middle" dominant-baseline="central" fill="#185FA5">creates conversation → {id} [#30]</text>
<line x1="740" y1="1544" x2="740" y2="1604" class="arr" marker-end="url(#arrow)"/>

<rect x="570" y="1604" width="340" height="78" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" stroke-dasharray="5 4"/>
