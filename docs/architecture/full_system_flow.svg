<svg width="100%" viewBox="0 0 1300 2450" xmlns="http://www.w3.org/2000/svg" role="img">
<title>agentic-rag-platform — full system flow</title>
<desc>Ingestion pipeline, single-shot query flow, and multi-turn conversation flow, with datastores and current implementation status. Solid border means implemented, dashed border means designed but not yet built, and an amber note means the endpoint exists but returns 501. Bracketed numbers reference decisions in docs/architecture.md.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.ts.amber { fill: #854F0B; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
</style>

<text class="th" x="40" y="30" dominant-baseline="central">A — ingestion pipeline</text>

<rect x="40" y="70" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="115" y="90" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Client</text>
<text class="ts" x="115" y="108" text-anchor="middle" dominant-baseline="central">submits repo URL</text>
<line x1="190" y1="98" x2="220" y2="98" class="arr" marker-end="url(#arrow)"/>

<rect x="220" y="70" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="310" y="90" text-anchor="middle" dominant-baseline="central" fill="#0C447C">POST /jobs</text>
<text class="ts" x="310" y="108" text-anchor="middle" dominant-baseline="central" fill="#185FA5">{url} → ack + job_id [#3]</text>
<path d="M400 98 L430 98 L430 128 L460 128" class="arr" marker-end="url(#arrow)"/>

<rect x="440" y="50" width="680" height="190" rx="8" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="780" y="66" text-anchor="middle" dominant-baseline="central">Job queue — batched execution [#7]</text>

<rect x="460" y="100" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
