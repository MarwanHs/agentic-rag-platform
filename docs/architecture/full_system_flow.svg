<line x1="600" y1="128" x2="620" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="620" y="100" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="690" y="128" text-anchor="middle" dominant-baseline="central">Parse</text>
<text class="ts" x="690" y="146" text-anchor="middle" dominant-baseline="central">tree-sitter</text>
<line x1="760" y1="128" x2="780" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="780" y="100" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="850" y="128" text-anchor="middle" dominant-baseline="central">Embed</text>
<text class="ts" x="850" y="146" text-anchor="middle" dominant-baseline="central">voyage-code-3 [#19]</text>
<line x1="920" y1="128" x2="940" y2="128" class="arr" marker-end="url(#arrow)"/>

<rect x="940" y="100" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="1010" y="128" text-anchor="middle" dominant-baseline="central">Index</text>
<text class="ts" x="1010" y="146" text-anchor="middle" dominant-baseline="central">Qdrant + Postgres</text>

<text class="ts" x="560" y="178" text-anchor="middle" dominant-baseline="central">repo discarded after ingestion [#15]</text>
<text class="ts" x="780" y="200" text-anchor="middle" dominant-baseline="central">queue technology (arq/Celery/etc.) not yet decided</text>

<path d="M780 240 L780 265 L850 265 L850 300" class="arr" marker-end="url(#arrow)"/>

<rect x="700" y="300" width="300" height="78" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
