<svg width="100%" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Multi-turn conversation query flow</title>
<desc>A follow-up message arrives for an existing conversation. The planner, with access to persisted conversation history via LangGraph's Postgres checkpointer, decides whether existing context already answers the question. If yes, it bypasses the retriever and code-navigation tool entirely and goes straight to the critic-synthesizer. If no, it branches to the retriever and/or code-navigation tool exactly as in the single-shot flow, then merges into the critic-synthesizer. The critic-synthesizer always runs either way, since it is the only component that produces the final answer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.ts { font-size: 11.5px; fill: #5f5e5a; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: 0.5px; }
.lbl { font-size: 12px; font-weight: 500; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
</style>

<rect x="230" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="350" y="60" text-anchor="middle" dominant-baseline="central">Follow-up message</text>
<text class="ts" x="350" y="78" text-anchor="middle" dominant-baseline="central">POST /conversations/{id}/messages</text>
<line x1="350" y1="96" x2="350" y2="160" class="arr" marker-end="url(#arrow)"/>

<rect x="20" y="176" width="150" height="48" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="95" y="192" text-anchor="middle" dominant-baseline="central" font-size="13">Checkpointed state</text>
<text class="ts" x="95" y="208" text-anchor="middle" dominant-baseline="central">Postgres, LangGraph</text>
<path d="M230 200 L170 200" class="leader"/>

<rect x="230" y="160" width="240" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="tag" x="350" y="178" text-anchor="middle" dominant-baseline="central" fill="#534AB7">AGENT — REASONS OVER HISTORY</text>
<text class="th" x="350" y="196" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
<text class="ts" x="350" y="212" text-anchor="middle" dominant-baseline="central" fill="#534AB7">is existing context enough?</text>

<path d="M470 175 L930 175 L930 508 L570 508" class="arr" marker-end="url(#arrow)"/>
<rect x="640" y="150" width="220" height="30" rx="6" fill="#F1EFE8" stroke="none"/>
<text class="lbl" x="750" y="165" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">yes — skip straight to answer</text>

<path d="M350 224 L350 268 L240 268 L240 340" class="arr" marker-end="url(#arrow)"/>
<path d="M350 224 L350 268 L660 268 L660 340" class="arr" marker-end="url(#arrow)"/>
<rect x="255" y="253" width="190" height="26" rx="6" fill="#F1EFE8" stroke="none"/>
<text class="lbl" x="350" y="266" text-anchor="middle" dominant-baseline="central" fill="#2c2c2a">no — gather fresh evidence</text>

<rect x="130" y="340" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="tag" x="240" y="356" text-anchor="middle" dominant-baseline="central" fill="#534AB7">AGENT — REASONS</text>
<text class="th" x="240" y="373" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Retriever</text>
<text class="ts" x="240" y="388" text-anchor="middle" dominant-baseline="central" fill="#534AB7">dense + BM25, RRF, rerank</text>

<rect x="550" y="340" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="tag" x="660" y="356" text-anchor="middle" dominant-baseline="central" fill="#993C1D">TOOL — DETERMINISTIC</text>
<text class="th" x="660" y="373" text-anchor="middle" dominant-baseline="central" fill="#712B13">Code-navigation</text>
<text class="ts" x="660" y="388" text-anchor="middle" dominant-baseline="central" fill="#993C1D">no reasoning, no LLM call</text>

<path d="M240 396 L240 440 L450 440 L450 480" class="arr" marker-end="url(#arrow)"/>
<path d="M660 396 L660 440 L450 440 L450 480" class="arr" marker-end="url(#arrow)"/>

<rect x="330" y="480" width="240" height="72" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="tag" x="450" y="498" text-anchor="middle" dominant-baseline="central" fill="#534AB7">AGENT — ALWAYS RUNS</text>
<text class="th" x="450" y="516" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Critic-synthesizer</text>
<text class="ts" x="450" y="533" text-anchor="middle" dominant-baseline="central" fill="#534AB7">one call, either path</text>
<line x1="450" y1="552" x2="450" y2="616" class="arr" marker-end="url(#arrow)"/>

<rect x="330" y="616" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="450" y="640" text-anchor="middle" dominant-baseline="central" font-size="13">Answer, saved to conversation</text>

<text class="ts" x="500" y="710" text-anchor="middle" fill="#888780">The critic-synthesizer always runs — it's the only component that produces the answer text.</text>
<text class="ts" x="500" y="728" text-anchor="middle" fill="#888780">The planner's check only decides whether the retriever/code-navigation branch runs first.</text>
</svg>
