<svg width="100%" viewBox="0 0 680 588" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ingestion pipeline architecture</title>
<desc>Client submits a GitHub URL, API acks with a job ID, an async job queue runs a batched clone-parse-embed-index pipeline, writing to a per-codebase vector store while updating a job status table.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.t { font-size: 14px; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
.leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
</style>

<rect x="150" y="40" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="260" y="62" text-anchor="middle" dominant-baseline="central">Client</text>
<line x1="260" y1="84" x2="260" y2="144" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="144" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="260" y="164" text-anchor="middle" dominant-baseline="central" fill="#0C447C">API gateway</text>
<text class="ts" x="260" y="182" text-anchor="middle" dominant-baseline="central" fill="#185FA5">Ack + job id</text>
<line x1="260" y1="200" x2="260" y2="260" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="260" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="260" y="280" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Job queue</text>
<text class="ts" x="260" y="298" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Async, batched</text>
<line x1="260" y1="316" x2="260" y2="376" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="376" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="260" y="396" text-anchor="middle" dominant-baseline="central" fill="#085041">Ingestion pipeline</text>
<text class="ts" x="260" y="414" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Clone, parse, embed, index</text>
<line x1="260" y1="432" x2="260" y2="492" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="492" width="220" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="260" y="512" text-anchor="middle" dominant-baseline="central" fill="#27500A">Vector store</text>
<text class="ts" x="260" y="530" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Per-codebase collection</text>

<rect x="420" y="318" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="520" y="338" text-anchor="middle" dominant-baseline="central">Job status table</text>
<text class="ts" x="520" y="356" text-anchor="middle" dominant-baseline="central">Per-step progress</text>

<path d="M370 346 L420 346" class="leader" marker-end="url(#arrow)"/>
</svg>
