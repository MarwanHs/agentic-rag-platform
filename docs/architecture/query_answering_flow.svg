<svg width="100%" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Query answering architecture</title>
<desc>Client sends a codebase id and question. The Claude-based planner decides whether to invoke the retriever agent, the code-navigation agent, or both. Their results merge into a single critic-synthesizer call, which returns a grounded, cited answer or a refusal.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #2c2c2a; }
.ts { font-size: 12px; fill: #5f5e5a; }
.arr { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
</style>

<rect x="150" y="40" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="260" y="60" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Client request</text>
<text class="ts" x="260" y="78" text-anchor="middle" dominant-baseline="central" fill="#185FA5">codebase id + question</text>
<line x1="260" y1="96" x2="260" y2="180" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="180" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="260" y="200" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Planner</text>
<text class="ts" x="260" y="218" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Claude, decides routing</text>

<path d="M260 236 L260 278 L180 278 L180 320" class="arr" marker-end="url(#arrow)"/>
<path d="M260 236 L260 278 L480 278 L480 320" class="arr" marker-end="url(#arrow)"/>

<rect x="80" y="320" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="180" y="340" text-anchor="middle" dominant-baseline="central" fill="#085041">Retriever agent</text>
<text class="ts" x="180" y="358" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Claude + Voyage, semantic</text>

<rect x="380" y="320" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="480" y="340" text-anchor="middle" dominant-baseline="central" fill="#712B13">Code-navigation agent</text>
<text class="ts" x="480" y="358" text-anchor="middle" dominant-baseline="central" fill="#993C1D">Deterministic, structural</text>

<path d="M180 376 L180 418 L260 418 L260 460" class="arr" marker-end="url(#arrow)"/>
<path d="M480 376 L480 418 L260 418 L260 460" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="460" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="260" y="480" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Critic-synthesizer</text>
<text class="ts" x="260" y="498" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Claude, verify then answer</text>
<line x1="260" y1="516" x2="260" y2="576" class="arr" marker-end="url(#arrow)"/>

<rect x="150" y="576" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="260" y="598" text-anchor="middle" dominant-baseline="central">Answer or refusal</text>
</svg>
