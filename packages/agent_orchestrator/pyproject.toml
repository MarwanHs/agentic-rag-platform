[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Planner, retriever, code-navigation, and critic-synthesizer agents, and the routing between them."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "rag-core",
    "anthropic>=0.40",
]

[tool.uv.sources]
shared = { workspace = true }
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestrator"]
