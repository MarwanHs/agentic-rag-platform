[project]
name = "rag-core"
version = "0.1.0"
description = "Ingestion pipeline and retrieval: cloning, parsing, embedding, indexing, hybrid search."
requires-python = ">=3.12"
dependencies = [
    "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
