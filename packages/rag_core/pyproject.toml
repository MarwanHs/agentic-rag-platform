[project]
name = "rag-core"
version = "0.1.0"
description = "Ingestion pipeline and retrieval: cloning, parsing, embedding, indexing, hybrid search."
requires-python = ">=3.12"
dependencies = [
    "shared",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "voyageai>=0.3",
    "qdrant-client[fastembed]>=1.12",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_core"]
