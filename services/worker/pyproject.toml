[project]
name = "worker"
version = "0.1.0"
description = "Standalone ingestion worker: dequeues jobs and runs clone -> parse -> embed -> index."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "shared",
    "rag-core",
]

[tool.uv.sources]
shared = { workspace = true }
rag-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
